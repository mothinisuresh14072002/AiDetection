<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiDetection</title>
<style>
body{font-family:system-ui;max-width:800px;margin:60px auto;padding:20px}
main{border:2px dashed #888;border-radius:18px;padding:50px;text-align:center}
button{padding:12px 20px;border-radius:10px;border:0}
pre{text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<h1>AiDetection</h1>
<p>Multimodal AI-media analysis</p>
<main>
<input id="f" type="file" accept="image/*,audio/*,video/*"><br><br>
<button onclick="go()">Analyze</button>
<pre id="o"></pre>
</main>
<script>
async function go(){
  const f=document.querySelector('#f').files[0],o=document.querySelector('#o');
  if(!f){o.textContent='Choose a media file.';return}
  const d=new FormData();d.append('file',f);o.textContent='Analyzing…';
  try{
    const r=await fetch('/v1/analyze',{method:'POST',body:d});
    o.textContent=JSON.stringify(await r.json(),null,2);
  }catch(e){o.textContent='Request failed. Make sure the API is running.'}
}
</script>
</body>
</html>
