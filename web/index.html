<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiDetection — AI Media Detector</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:32px;background:#f6f7f9;color:#16181d}
.card{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #0001}
.drop{border:2px dashed #999;border-radius:16px;padding:42px;text-align:center}
button{padding:12px 20px;border:0;border-radius:10px;cursor:pointer}
#result{margin-top:20px;display:none}.label{font-size:28px;font-weight:700}
pre{white-space:pre-wrap;background:#f1f2f4;padding:16px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h1>AiDetection</h1>
<p>Analyze images, audio, and video for synthetic-media signals.</p>
<div class="drop">
<input id="f" type="file" accept="image/*,audio/*,video/*">
<p><button onclick="go()">Analyze media</button></p>
<div id="status"></div>
</div>
<div id="result"><div class="label" id="label"></div><p id="confidence"></p><pre id="signals"></pre></div>
<p><small>Detection is probabilistic. A score is not proof of authorship or provenance.</small></p>
</div>
<script>
async function go(){
 const file=document.querySelector('#f').files[0],status=document.querySelector('#status');
 const result=document.querySelector('#result');
 if(!file){status.textContent='Choose a file first.';return}
 status.textContent='Analyzing…'; result.style.display='none';
 const data=new FormData();data.append('file',file);
 try{
  const r=await fetch('/v1/analyze',{method:'POST',body:data}),j=await r.json();
  if(!r.ok) throw new Error(j.detail||'Analysis failed');
  document.querySelector('#label').textContent=j.label;
  document.querySelector('#confidence').textContent='Confidence: '+Math.round(j.confidence*100)+'%';
  document.querySelector('#signals').textContent=j.signals.join('\n');
  result.style.display='block';status.textContent='';
 }catch(e){status.textContent=e.message}
}
</script>
</body>
</html>
