[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetection"
version = "0.4.1"
description = "Multimodal AI-generated media detection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "scikit-learn>=1.5,<2"]
evaluation = ["scikit-learn>=1.5,<2"]
models = ["transformers>=4.45,<6", "torch>=2.4,<3", "pillow>=10,<13", "opencv-python-headless>=4.10,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
